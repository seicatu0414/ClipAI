services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipai}
      POSTGRES_USER: ${POSTGRES_USER:-clipai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "clipai.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLIPAI_ENVIRONMENT: ${CLIPAI_ENVIRONMENT:-local}
      CLIPAI_LOG_LEVEL: ${CLIPAI_LOG_LEVEL:-INFO}
      CLIPAI_DATABASE_URL: ${CLIPAI_DATABASE_URL:-postgresql://clipai:clipai@db:5432/clipai}
      CLIPAI_MEDIA_ROOT: /data
    volumes:
      - ${CLIPAI_MEDIA_ROOT:-./data}:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "clipai.worker"]
    environment:
      CLIPAI_ENVIRONMENT: ${CLIPAI_ENVIRONMENT:-local}
      CLIPAI_LOG_LEVEL: ${CLIPAI_LOG_LEVEL:-INFO}
      CLIPAI_DATABASE_URL: ${CLIPAI_DATABASE_URL:-postgresql://clipai:clipai@db:5432/clipai}
      CLIPAI_MEDIA_ROOT: /data
      CLIPAI_MODEL_SIZE: ${CLIPAI_MODEL_SIZE:-large-v3}
      CLIPAI_LANGUAGE: ${CLIPAI_LANGUAGE:-ja}
      CLIPAI_DEVICE: ${CLIPAI_DEVICE:-auto}
      CLIPAI_CPU_FALLBACK: ${CLIPAI_CPU_FALLBACK:-true}
      CLIPAI_WORKER_POLL_INTERVAL_SECONDS: ${CLIPAI_WORKER_POLL_INTERVAL_SECONDS:-2}
    volumes:
      - ${CLIPAI_MEDIA_ROOT:-./data}:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
