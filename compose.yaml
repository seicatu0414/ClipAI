services:
  media-init:
    build:
      context: .
      target: runtime
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /data/work /data/artifacts && chown -R 10001:10001 /data/work /data/artifacts
    volumes:
      - ${CLIPAI_MEDIA_ROOT:-./data}:/data
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipai}
      POSTGRES_USER: ${POSTGRES_USER:-clipai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "clipai.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLIPAI_ENVIRONMENT: ${CLIPAI_ENVIRONMENT:-local}
      CLIPAI_LOG_LEVEL: ${CLIPAI_LOG_LEVEL:-INFO}
      CLIPAI_DATABASE_URL: ${CLIPAI_DATABASE_URL:-postgresql://clipai:clipai@db:5432/clipai}
      CLIPAI_MEDIA_ROOT: /data
      CLIPAI_EVENT_MIN_CONFIDENCE: ${CLIPAI_EVENT_MIN_CONFIDENCE:-0.55}
      CLIPAI_EVENT_LOUDNESS_DELTA_DB: ${CLIPAI_EVENT_LOUDNESS_DELTA_DB:-12}
      CLIPAI_EVENT_SILENCE_DB: ${CLIPAI_EVENT_SILENCE_DB:--48}
      CLIPAI_EVENT_SILENCE_MIN_SECONDS: ${CLIPAI_EVENT_SILENCE_MIN_SECONDS:-2}
      CLIPAI_EVENT_MERGE_GAP_SECONDS: ${CLIPAI_EVENT_MERGE_GAP_SECONDS:-2}
      CLIPAI_OLLAMA_URL: ${CLIPAI_OLLAMA_URL:-http://ollama:11434}
      CLIPAI_OLLAMA_MODEL: ${CLIPAI_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      CLIPAI_PROMPT_ROOT: /app/prompts
      CLIPAI_KNOWLEDGE_MAX_HISTORICAL_HOURS: ${CLIPAI_KNOWLEDGE_MAX_HISTORICAL_HOURS:-50}
      CLIPAI_KNOWLEDGE_MAX_REPRESENTATIVE_STREAMS: ${CLIPAI_KNOWLEDGE_MAX_REPRESENTATIVE_STREAMS:-10}
      CLIPAI_KNOWLEDGE_CHUNK_CHARACTERS: ${CLIPAI_KNOWLEDGE_CHUNK_CHARACTERS:-12000}
      CLIPAI_CANDIDATE_TARGET_COUNT: ${CLIPAI_CANDIDATE_TARGET_COUNT:-25}
      CLIPAI_CANDIDATE_MINIMUM_SECONDS: ${CLIPAI_CANDIDATE_MINIMUM_SECONDS:-15}
      CLIPAI_CANDIDATE_MAXIMUM_SECONDS: ${CLIPAI_CANDIDATE_MAXIMUM_SECONDS:-900}
      CLIPAI_CANDIDATE_ANCHOR_MAXIMUM_SECONDS: ${CLIPAI_CANDIDATE_ANCHOR_MAXIMUM_SECONDS:-120}
      CLIPAI_CANDIDATE_CONTEXT_WINDOW_SECONDS: ${CLIPAI_CANDIDATE_CONTEXT_WINDOW_SECONDS:-600}
      CLIPAI_CANDIDATE_MAXIMUM_CONTEXT_SECONDS: ${CLIPAI_CANDIDATE_MAXIMUM_CONTEXT_SECONDS:-1800}
      CLIPAI_CANDIDATE_CONTEXT_EXPANSION_SECONDS: ${CLIPAI_CANDIDATE_CONTEXT_EXPANSION_SECONDS:-300}
      CLIPAI_CANDIDATE_DETAILED_ANALYSIS_CONFIDENCE: ${CLIPAI_CANDIDATE_DETAILED_ANALYSIS_CONFIDENCE:-0.65}
      CLIPAI_CANDIDATE_END_BOUNDARY_COUNT: ${CLIPAI_CANDIDATE_END_BOUNDARY_COUNT:-5}
    volumes:
      - ${CLIPAI_MEDIA_ROOT:-./data}:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "clipai.worker"]
    environment:
      CLIPAI_ENVIRONMENT: ${CLIPAI_ENVIRONMENT:-local}
      CLIPAI_LOG_LEVEL: ${CLIPAI_LOG_LEVEL:-INFO}
      CLIPAI_DATABASE_URL: ${CLIPAI_DATABASE_URL:-postgresql://clipai:clipai@db:5432/clipai}
      CLIPAI_MEDIA_ROOT: /data
      CLIPAI_MODEL_SIZE: ${CLIPAI_MODEL_SIZE:-large-v3}
      CLIPAI_LANGUAGE: ${CLIPAI_LANGUAGE:-ja}
      CLIPAI_DEVICE: ${CLIPAI_DEVICE:-auto}
      CLIPAI_CPU_FALLBACK: ${CLIPAI_CPU_FALLBACK:-true}
      CLIPAI_WORKER_POLL_INTERVAL_SECONDS: ${CLIPAI_WORKER_POLL_INTERVAL_SECONDS:-2}
      CLIPAI_EVENT_MIN_CONFIDENCE: ${CLIPAI_EVENT_MIN_CONFIDENCE:-0.55}
      CLIPAI_EVENT_LOUDNESS_DELTA_DB: ${CLIPAI_EVENT_LOUDNESS_DELTA_DB:-12}
      CLIPAI_EVENT_SILENCE_DB: ${CLIPAI_EVENT_SILENCE_DB:--48}
      CLIPAI_EVENT_SILENCE_MIN_SECONDS: ${CLIPAI_EVENT_SILENCE_MIN_SECONDS:-2}
      CLIPAI_EVENT_MERGE_GAP_SECONDS: ${CLIPAI_EVENT_MERGE_GAP_SECONDS:-2}
      CLIPAI_OLLAMA_URL: ${CLIPAI_OLLAMA_URL:-http://ollama:11434}
      CLIPAI_OLLAMA_MODEL: ${CLIPAI_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      CLIPAI_PROMPT_ROOT: /app/prompts
      CLIPAI_KNOWLEDGE_MAX_HISTORICAL_HOURS: ${CLIPAI_KNOWLEDGE_MAX_HISTORICAL_HOURS:-50}
      CLIPAI_KNOWLEDGE_MAX_REPRESENTATIVE_STREAMS: ${CLIPAI_KNOWLEDGE_MAX_REPRESENTATIVE_STREAMS:-10}
      CLIPAI_KNOWLEDGE_CHUNK_CHARACTERS: ${CLIPAI_KNOWLEDGE_CHUNK_CHARACTERS:-12000}
      CLIPAI_CANDIDATE_TARGET_COUNT: ${CLIPAI_CANDIDATE_TARGET_COUNT:-25}
      CLIPAI_CANDIDATE_MINIMUM_SECONDS: ${CLIPAI_CANDIDATE_MINIMUM_SECONDS:-15}
      CLIPAI_CANDIDATE_MAXIMUM_SECONDS: ${CLIPAI_CANDIDATE_MAXIMUM_SECONDS:-900}
      CLIPAI_CANDIDATE_ANCHOR_MAXIMUM_SECONDS: ${CLIPAI_CANDIDATE_ANCHOR_MAXIMUM_SECONDS:-120}
      CLIPAI_CANDIDATE_CONTEXT_WINDOW_SECONDS: ${CLIPAI_CANDIDATE_CONTEXT_WINDOW_SECONDS:-600}
      CLIPAI_CANDIDATE_MAXIMUM_CONTEXT_SECONDS: ${CLIPAI_CANDIDATE_MAXIMUM_CONTEXT_SECONDS:-1800}
      CLIPAI_CANDIDATE_CONTEXT_EXPANSION_SECONDS: ${CLIPAI_CANDIDATE_CONTEXT_EXPANSION_SECONDS:-300}
      CLIPAI_CANDIDATE_DETAILED_ANALYSIS_CONFIDENCE: ${CLIPAI_CANDIDATE_DETAILED_ANALYSIS_CONFIDENCE:-0.65}
      CLIPAI_CANDIDATE_END_BOUNDARY_COUNT: ${CLIPAI_CANDIDATE_END_BOUNDARY_COUNT:-5}
    volumes:
      - ${CLIPAI_MEDIA_ROOT:-./data}:/data
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
